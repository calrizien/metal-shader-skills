name: Metal 4 checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: MSL 4.1 compile and package checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate the Metal compiler
        run: |
          xcodebuild -version
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Check generated files
        run: |
          python3 skills/metal-shader-art/scripts/metal_tools.py index --check
          python3 tests/build_gallery.py --check
      - name: Compile every MSL unit
        run: python3 skills/metal-shader-art/scripts/metal_tools.py check
      - name: Validate model evaluation cases
        run: python3 tests/check_evals.py
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-compile
          path: build/metal-compile/
